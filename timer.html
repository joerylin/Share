<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒數計時器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .timer-display {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }

        .timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-circle {
            fill: none;
            stroke-width: 20;
        }

        .background-circle {
            stroke: #e0e0e0;
        }

        .progress-circle {
            stroke: #FFA500;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .time-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #333;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-wrapper label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .start-btn {
            background: #4CAF50;
            color: white;
        }

        .start-btn:hover {
            background: #45a049;
        }

        .pause-btn {
            background: #FF9800;
            color: white;
        }

        .pause-btn:hover {
            background: #F57C00;
        }

        .reset-btn {
            background: #f44336;
            color: white;
        }

        .reset-btn:hover {
            background: #da190b;
        }

        .settings {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .settings h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .color-picker {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .color-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .color-option label {
            font-size: 12px;
            color: #666;
        }

        input[type="color"] {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .warning-text {
            color: #f44336;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @media (max-width: 400px) {
            .timer-display {
                width: 250px;
                height: 250px;
            }

            .time-text {
                font-size: 36px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ 倒數計時器</h1>

        <div class="timer-display">
            <svg class="timer-svg" viewBox="0 0 100 100">
                <circle class="timer-circle background-circle" cx="50" cy="50" r="45"/>
                <circle class="timer-circle progress-circle" id="progressCircle" cx="50" cy="50" r="45" 
                        stroke-dasharray="282.74" stroke-dashoffset="0"/>
            </svg>
            <div class="time-text" id="timeText">00:00</div>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <label>分鐘</label>
                <input type="number" id="minutesInput" min="0" max="99" value="5" placeholder="分">
            </div>
            <div class="input-wrapper">
                <label>秒鐘</label>
                <input type="number" id="secondsInput" min="0" max="59" value="0" placeholder="秒">
            </div>
        </div>

        <div class="buttons">
            <button class="start-btn" onclick="startTimer()">開始</button>
            <button class="pause-btn" onclick="pauseTimer()">暫停</button>
            <button class="reset-btn" onclick="resetTimer()">重置</button>
        </div>

        <div class="settings">
            <h3>🎨 顏色設定</h3>
            <div class="color-picker">
                <div class="color-option">
                    <label>一般倒數顏色</label>
                    <input type="color" id="normalColor" value="#FFA500">
                </div>
                <div class="color-option">
                    <label>最後 N 秒顏色</label>
                    <input type="color" id="warningColor" value="#FF0000">
                </div>
                <div class="color-option">
                    <label>最後 N 秒</label>
                    <input type="number" id="warningSeconds" min="1" max="60" value="10" style="width: 60px;">
                </div>
            </div>
        </div>
    </div>

    <script>
        let totalTime = 0;
        let remainingTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let isPaused = false;

        const progressCircle = document.getElementById('progressCircle');
        const timeText = document.getElementById('timeText');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const normalColorInput = document.getElementById('normalColor');
        const warningColorInput = document.getElementById('warningColor');
        const warningSecondsInput = document.getElementById('warningSeconds');

        const circumference = 2 * Math.PI * 45;
        progressCircle.style.strokeDasharray = circumference;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeText.textContent = formatTime(remainingTime);

            const progress = remainingTime / totalTime;
            const offset = circumference * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;

            const warningSeconds = parseInt(warningSecondsInput.value) || 10;
            if (remainingTime <= warningSeconds && remainingTime > 0) {
                progressCircle.style.stroke = warningColorInput.value;
                timeText.classList.add('warning-text');
            } else {
                progressCircle.style.stroke = normalColorInput.value;
                timeText.classList.remove('warning-text');
            }
        }

        function startTimer() {
            if (isRunning && !isPaused) return;

            if (!isPaused) {
                const mins = parseInt(minutesInput.value) || 0;
                const secs = parseInt(secondsInput.value) || 0;
                totalTime = mins * 60 + secs;
                remainingTime = totalTime;
            }

            if (totalTime <= 0) {
                alert('請設定倒數時間！');
                return;
            }

            isRunning = true;
            isPaused = false;
            updateDisplay();

            timerInterval = setInterval(() => {
                remainingTime--;
                updateDisplay();

                if (remainingTime <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    alert('⏰ 時間到！');
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;

            clearInterval(timerInterval);
            isPaused = true;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isPaused = false;
            remainingTime = 0;
            totalTime = 0;
            updateDisplay();
            progressCircle.style.stroke = normalColorInput.value;
            timeText.classList.remove('warning-text');
        }

        normalColorInput.addEventListener('input', updateDisplay);
        warningColorInput.addEventListener('input', updateDisplay);

        updateDisplay();
    </script>
</body>
</html>
